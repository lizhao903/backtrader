name: CI

on:
  push:
    branches: [main, 'dev/**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install package and tools
        run: pip install -e . ruff pytest
      - name: Ruff lint
        id: ruff
        continue-on-error: false
        run: ruff check .
      - name: Pytest
        id: test
        continue-on-error: true
        run: pytest tests/ -q --tb=no
      - name: Report outcomes
        if: always()
        run: echo "ruff=${{ steps.ruff.outcome }} pytest=${{ steps.test.outcome }}"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ruff
        run: pip install ruff
      - name: Ruff lint
        run: ruff check .
